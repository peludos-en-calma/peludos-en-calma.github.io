.legal-grid{display:flex;flex-wrap:wrap;gap:32px 56px;align-items:flex-start}
.legal-nav{flex:1 1 220px;max-width:280px;position:sticky;top:calc(100px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.legal-nav a{display:flex;align-items:center;min-height:48px;padding:0 18px;border-radius:16px;font-weight:800;color:var(--ink);text-decoration:none;transition:background-color .25s,color .25s,transform .3s var(--spring)}
.legal-nav a:hover{background:var(--surface);color:var(--ink);transform:translateX(4px)}
.legal-nav a[aria-current="page"]{background:var(--ink);color:#fff;transform:none}
.legal-body{flex:3 1 560px;min-width:0;max-width:820px;display:flex;flex-direction:column;gap:20px}
.legal-head{display:flex;flex-direction:column;gap:16px;margin-bottom:8px}
.legal-head h1{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:clamp(32px,4vw,52px);line-height:1.1}
.legal-sec{background:var(--surface);border-radius:28px;padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:12px}
.legal-sec h2{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;font-size:clamp(18px,1.6vw,21px);line-height:1.3}
.legal-sec p,.legal-sec li{color:var(--soft);max-width:70ch}
.legal-sec ul{display:flex;flex-direction:column;gap:8px}
.legal-sec li{position:relative;padding-left:22px}
.legal-sec li::before{content:"";position:absolute;left:4px;top:.68em;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.7}
.prevails{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-radius:20px;background:var(--lilac);font-size:15px;font-weight:700;line-height:1.5}
.prevails .ic{font-size:22px;color:var(--violet);margin-top:1px}
@media (max-width:860px){
  .legal-nav{position:static;max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap}
  .legal-nav a{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
}
@media (max-width:640px){.legal-page .hdr .seg{display:inline-flex}}
@media (max-width:440px){.legal-page .logo-txt{display:none}}
.js.intro .legal-nav{animation:rise .8s var(--ease) .05s backwards}
.js.intro .legal-head{animation:rise .8s var(--ease) .12s backwards}
.js.intro .legal-sec{animation:rise .8s var(--ease) calc(.2s + var(--i,0)*70ms) backwards}

<script id="i18n-data" type="application/json">/*I18N_JSON*/</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('i18n-data').textContent);
  const root = document.documentElement;
  const body = document.body;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $$ = (s) => Array.from(document.querySelectorAll(s));
  const get = (obj, path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  root.classList.add('js');
  if (!reduce) root.classList.add('intro');
  setTimeout(() => root.classList.remove('intro'), 2000);

  let lang = 'es';
  root.lang = 'es';

  function syncLinks() {
    $$('a[data-page]').forEach((a) => {
      if (!a.dataset.base) a.dataset.base = a.getAttribute('href');
      const [path, hash] = a.dataset.base.split('#');
      a.setAttribute('href', path + (lang === 'es' ? '' : '?lang=' + lang) + (hash ? '#' + hash : ''));
    });
  }

  function apply(next) {
    const t = DATA[next];
    lang = next;
    root.lang = next;
    $$('[data-i18n]').forEach((el) => {
      const v = get(t, el.dataset.i18n);
      if (typeof v === 'string') el.textContent = v;
    });
    $$('[data-i18n-attr]').forEach((el) => {
      el.dataset.i18nAttr.split(';').forEach((pair) => {
        const [attr, path] = pair.split(':');
        const v = get(t, path);
        if (typeof v === 'string') el.setAttribute(attr, v);
      });
    });
    document.title = t.doc.metaTitle;
    $$('[data-lang]').forEach((b) => {
      const on = b.dataset.lang === next;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    syncLinks();
    try {
      const u = new URL(window.location.href);
      if (next === 'es') u.searchParams.delete('lang'); else u.searchParams.set('lang', next);
      window.history.replaceState(null, '', u);
    } catch (e) { /* the address bar is optional */ }
  }

  function switchLang(next) {
    if (!DATA[next] || next === lang) return;
    if (reduce) { apply(next); return; }
    body.classList.add('is-switching');
    setTimeout(() => {
      apply(next);
      requestAnimationFrame(() => body.classList.remove('is-switching'));
    }, 180);
  }
  $$('[data-lang]').forEach((b) => b.addEventListener('click', () => switchLang(b.dataset.lang)));
  try {
    const q = new URL(window.location.href).searchParams.get('lang');
    if (q && DATA[q] && q !== 'es') apply(q);
  } catch (e) { /* stay in Spanish */ }
  syncLinks();

  const hdr = document.getElementById('hdr');
  const progress = document.getElementById('progress');
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      hdr.classList.toggle('scrolled', y > 8);
      progress.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, y / max) : 0) + ')';
    });
  }, { passive: true });
})();
</script>
